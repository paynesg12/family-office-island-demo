nt-size:12px;display:flex;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}.detail{position:fixed;z-index:5;top:120px;left:18px;width:355px;max-height:calc(100vh - 215px);padding:18px;border-radius:21px;overflow:auto;display:none}.detail.open{display:block}.close{float:right;border:0;border-radius:50%;width:30px;height:30px;background:#f4e8df;font-size:18px;cursor:pointer}.detail h3{font-size:14px;margin:17px 0 7px}.detail p,.detail li{font-size:13px;line-height:1.55;color:#5e5550}.bar{height:8px;background:#eaded4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--coral);border-radius:99px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:0;border-radius:99px;padding:5px 9px;background:#fff8f4;box-shadow:0 2px 8px #4a2a1414;font-size:11px;cursor:pointer}.toolbar{position:fixed;z-index:4;bottom:17px;left:50%;transform:translateX(-50%);padding:6px;display:flex;gap:6px;border-radius:17px}.toolbar button,.action{min-height:44px;border:0;border-radius:9px;padding:6px 10px;background:#fff8f4;color:var(--ink);cursor:pointer}.toolbar button:hover,.toolbar button.active,.action:hover{background:var(--yellow)}.toolbar b{display:block;font-size:16px}.tool-label{font-size:10px}.drawer{position:fixed;z-index:4;bottom:17px;right:337px;border-radius:16px;padding:10px;display:flex;gap:6px}.drawer button{border:0;background:none;cursor:pointer;padding:5px;color:#5e5550}.modal{position:fixed;z-index:10;inset:0;background:#211d1d55;display:none;place-items:center;padding:18px}.modal.open{display:grid}.modal-box{width:min(720px,100%);max-height:88vh;overflow:auto;background:#fffdf9;border-radius:22px;padding:21px;box-shadow:0 20px 60px #211d1d44}.modal h2{margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:grid;gap:4px;font-size:12px;color:#615751}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #dfd0c4;border-radius:8px;background:#fff;font:inherit;color:var(- </style></head><body><div id="world"></div><div id="loading" class="loader"><h2>正在佈置家庭辦公室…</h2><span>示範資料 · 僅儲存在這台裝置</span></div><main id="ui" class="panel"><section class="brand glass"><div class="eyebrow">FAMILY OFFICE · LOCAL-ONLY</div><h1>家庭辦公室 🏠</h1><small id="stamp">範例資料・尚未同步</small></section><section class="summary" id="summary"></section><button id="menuToggle" class="menu-toggle" aria-expanded="true">☰ 收合面向</button><aside id="sidebar" class="sidebar glass"><h2>家庭五大面向</h2><div id="islandList"></div><section class="priority"><div class="eyebrow">本次一起處理</div><div id="priorityList"></div><button class="chip" id="allTodos">查看全部與討論 →</button></section></aside><section id="detail" class="detail glass"></section><nav class="toolbar glass"><button id="day"><b>☀</b><span class="tool-label">日夜</span></button><button id="overview"><b>⌁</b><span class="tool-label">全景</span></button><button id="bird"><b>◉</b><span class="tool-label">鳥瞰</span></button><button id="assumptions"><b>⚙</b><span class="tool-label">假設</span></button><button id="backup"><b>⇩</b><span class="tool-label">備份</span></button></nav><div class="drawer glass"><button id="importBtn">匯入</button><button id="resetBtn" class="danger">還原範例</button></div></main><div id="modal" class="modal"><section id="modalBox" class="modal-box"></section></div><section id="fallback" class="fallback"></section>

import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
const DATA={version:1,seed:714,settings:{monthly:20000,inflation:3,yield:3,years:8},assets:{cash:200000,dividend:1800000,retirement:300000,education:100000,home:800000,debt:400000,annualDividend:120000,annualEducation:36000,annualRetirement:24000},islands:[
{id:'assets',name:'資產與投資',en:'Assets & Investments',color:'#db6a41',model:'vault',current:'範例淨資產 US$2.80M；可支應生活的股息投資本金 US$1.80M。',goal:'用可用股息支應生活；教育基金與退休帳戶獨立管理。',gap:'今日生活費覆蓋率仍低，且不應把自住房視為股息來源。'},
{id:'education',name:'孩子與教育',en:'Child & Education',color:'#58a6a6',model:'school',current:'教育基金範例 US$100K；孩子目前 5 歲。',goal:'約 13 年後準備四年美國大學費用。',gap:'學校類型、地點與學費／生活費情境待討論。'},
{id:'travel',name:'旅行與生活願望',en:'Travel & Wishes',color:'#f2b5c6',model:'travel',current:'每年至少 3 次海外旅行；年度預算尚待決定。',goal:'保有想去就去的彈性與臨時出發準備金。',gap:'旅行是否已包含在每月 US$20K 生活費中待討論。'},
{id:'retirement',name:'退休與長期安排',en:'Retirement & Long Term',color:'#9cc27a',model:'home',current:'兩位成人為 42、40 歲，保留 8 與 10 年情境。',goal:'50 歲後每週工作 3 天，工作收入作為彈性而非基本生活必要來源。',gap:'尚未決定同一年減少工作，或各自滿 50 歲開始。'},
{id:'health',name:'健康與保障',en:'Health & Protection',color:'#6f7fb5',model:'clinic',current:'健康檢查、保單與重要文件需要統一盤點。',goal:'能支持台灣／美國兩地生活的保障與緊急應變。',gap:'保障缺口、跨境醫療與聯絡資訊尚待確認。'}],
links:[{from:'assets',to:'education',label:'教育資金配置',kind:'資金目標'},{from:'assets',to:'travel',label:'年度旅行準備金',kind:'生活目標'},{from:'assets',to:'retirement',label:'股息生活費來源',kind:'核心資金'},{from:'assets',to:'health',label:'保障與緊急緩衝',kind:'風險保障'},{from:'retirement',to:'health',label:'兩地長期醫療規劃',kind:'長期安排'}],
todos:[{id:'t1',topic:'retirement',title:'決定兩人減少工作的時間方式',status:'待討論',owner:'一起',date:'待設定',next:'比較同一年與各自滿 50 歲兩種情境',notes:''},{id:'t2',topic:'assets',title:'確認每月 US$20,000 的範圍',status:'待討論',owner:'一起',date:'待設定',next:'列出旅行、住房、醫療與稅金是否包含',notes:''},{id:'t3',topic:'education',title:'選擇美國大學費用情境',status:'待討論',owner:'成員 A',date:'待設定',next:'建立公立／私立與地區別範例',notes:''},{id:'t4',topic:'health',title:'盤點台美兩地醫療與保單資料',status:'待討論',owner:'成員 B',date:'待設定',next:'收集既有保單與緊急文件位置',notes:''},{id:'t5',topic:'travel',title:'設定年度旅行與臨時出發預算',status:'待討論',owner:'一起',date:'待設定',next:'先列三個願望目的地',notes:''},{id:'t6',topic:'assets',title:'確認每年範例新增投入如何調整',status:'待討論',owner:'一起',date:'待設定',next:'以實際收支建立討論基準',notes:''}]};
const $=s=>document.querySelector(s), fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number.isFinite(n)?n:0), pct=n=>Number.isFinite(n)?`${n.toFixed(1)}%`:'—';let state=load(),selected=null,night=false;function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{let x=JSON.parse(localStorage.getItem('family-office-island-v1'));if(valid(x))return x}catch(e){console.warn('localStorage unavailable',e)}return clone(DATA)}function valid(x){return x&&x.version===1&&x.settings&&x.assets&&Array.isArray(x.todos)&&Object.values(x.settings).every(v=>typeof v==='number'&&Number.isFinite(v))}function save(){try{localStorage.setItem('family-office-island-v1',JSON.stringify(state));$('#stamp').textContent='本機已儲存・示範資料'}catch(e){$('#stamp').textContent='本機儲存不可用；本次變更不會保留'}}
function calc(){let a=state.assets,s=state.settings,y=Math.max(0,s.yield)/100,years=Math.max(0,s.years),inf=Math.max(-99,s.inflation)/100,annual=a.dividend*y,monthly=annual/12,today=s.monthly*12,future=s.monthly*Math.pow(1+inf,years),need=y>0?future*12/y:null,net=a.cash+a.dividend+a.retirement+a.education+a.home-a.debt;return{a,y,years,annual,monthly,today,future,need,net,cover:today>0?annual/today*100:0,annualAdds:a.annualDividend+a.annualEducation+a.annualRetirement}}
function renderUI(){let c=calc();$('#summary').innerHTML=[['家庭淨資產',fmt(c.net)],['每月可用股息',fmt(c.monthly)],['生活費覆蓋率',pct(c.cover)],['需要一起處理',state.todos.filter(x=>x.status!=='已完成').length+' 件']].map((x,i)=>`<div class="stat glass"><small>${x[0]} <em class="sample">範例</em></small><b>${x[1]}</b></div>`).join('');$('#islandList').innerHTML=state.islands.map((x,i)=>`<button class="island-btn" data-island="${i}"><i class="dot" style="background:${x.color}"></i><span><b>${x.name}</b><small>${x.en}</small></span></button>`).join('');document.querySelectorAll('[data-island]').forEach(b=>b.onclick=()=>selectIsland(+b.dataset.island));let todo=state.todos.filter(x=>x.status!=='已完成').slice(0,3);$('#priorityList').innerHTML=todo.map(x=>`<div class="todo-mini"><span>□</span><span>${esc(x.title)}<br><small>${esc(x.owner)} · ${esc(x.status)}</small></span></div>`).join('')||'<p class="note">目前沒有待處理事項。</p>';if(selected!==null)detail(selected)}
function esc(x){return String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function detail(i){selected=i;let x=state.islands[i],c=calc(),todos=state.todos.filter(t=>t.topic===x.id),content='';if(x.id==='assets')content=`<div class="grid"><div><small>資產合計</small><b>${fmt(c.net+c.a.debt)}</b></div><div><small>負債</small><b>${fmt(c.a.debt)}</b></div><div><small>年新增投入</small><b>${fmt(c.annualAdds)}</b></div></div><h3>投資配置（範例）</h3><p>可用股息投資本金：<b>${fmt(c.a.dividend)}</b>；退休帳戶 ${fmt(c.a.retirement)}、教育基金 ${fmt(c.a.education)}、自住房 ${fmt(c.a.home)} 均不重複計入生活股息本金。</p>`;else if(x.id==='education')content=`<p>以孩子約 18 歲、距今 <b>13 年</b>為可調整的示範假設。教育基金 ${fmt(c.a.education)} 獨立列示。</p><div class="chips"><span class="chip">學費：待討論</span><span class="chip">住宿生活：待討論</span><span class="chip">交通保險：待討論</span></div>`;else if(x.id==='travel')content=`<p>至少三次海外旅行是最低期待，不是上限。示範版尚未為旅行填入金額，避免冒充已確認預算。</p><div class="chips"><span class="chip">年度旅行預算：待討論</span><span class="chip">臨時出發準備金：待討論</span></div>`;else if(x.id==='retirement')content=`<div class="grid"><div><small>${c.years} 年後月生活費</small><b>${fmt(c.future/12)}</b></div><div><small>所需股息本金</small><b>${c.need===null?'請設定正股息率':fmt(c.need)}</b></div><div><small>與現有股息本金差距</small><b>${c.need===null?'—':fmt(Math.max(0,c.need-c.a.dividend))}</b></div></div><p>這是以今日購買力每月 ${fmt(state.settings.monthly)}、通膨 ${state.settings.inflation}%、稅後可用股息率 ${state.settings.yield}% 的<strong>範例試算</strong>；不是退休適足性結論。</p>`;else content=`<p>不自行判定保險是否足夠，也不做跨境稅務或醫療結論。先把現有資料、缺口與下次檢視安排收好。</p><div class="chips"><span class="chip">健康檢查</span><span class="chip">保單整理</span><span class="chip">跨境醫療</span><span class="chip">緊急文件</span></div>`;$('#detail').classList.add('open');$('#detail').innerHTML=`<button class="close" id="close">×</button><div class="eyebrow">FAMILY ISLAND ${String(i+1).padStart(2,'0')}</div><h2>${x.name}</h2><p><b>目前狀況：</b>${x.current}</p><p><b>共同目標：</b>${x.goal}</p><p><b>需要注意：</b>${x.gap}</p>${content}<h3>和其他島的關係</h3><div class="chips">${DATA.links.filter(l=>l.from===x.id||l.to===x.id).map(l=>{let other=state.islands.find(q=>q.id===(l.from===x.id?l.to:l.from));return `<span class="chip">${esc(l.kind)} · ${esc(l.label)} → ${esc(other.name)}</span>`}).join('')||'<span class="note">尚未定義跨主題關係</span>'}</div><h3>夫妻討論與下一步</h3><div class="chips">${todos.map(t=>`<button class="chip" data-todo="${t.id}">${esc(t.title)} · ${esc(t.status)}</button>`).join('')||'<span class="note">尚未建立項目</span>'}</div><button class="action" id="addTodo" style="margin-top:12px">＋ 新增這個主題的討論</button>`;$('#close').onclick=()=>{$('#detail').classList.remove('open');selected=null};document.querySelectorAll('[data-todo]').forEach(b=>b.onclick=()=>todoModal(b.dataset.todo));$('#addTodo').onclick=()=>todoModal(null,x.id);moveCamera(i)}
function assumptions(){let s=state.settings,a=state.assets;openModal(`<h2>假設與範例資產</h2><p class="note">修改後只儲存在本機；不代表實際家庭資料。零或無效股息率不會產生無限大數字。</p><form id="settingsForm"><div class="grid"><label class="field">每月生活目標 USD<input required min="0" step="100" name="monthly" type="number" value="${s.monthly}"></label><label class="field">一般年通膨 %<input required min="-99" max="100" step=".1" name="inflation" type="number" value="${s.inflation}"></label><label class="field">稅後可用股息率 %<input required min="0" max="100" step=".1" name="yield" type="number" value="${s.yield}"></label><label class="field">比較期限<input name="years" type="select" value="${s.years}" style="display:none"><select id="years"><option value="8" ${s.years===8?'selected':''}>8 年（42 歲情境）</option><option value="10" ${s.years===10?'selected':''}>10 年（40 歲情境）</option></select></label><label class="field">可用股息投資本金 USD<input required min="0" step="1000" name="dividend" type="number" value="${a.dividend}"></label><label class="field">現金與存款 USD<input required min="0" step="1000" name="cash" type="number" value="${a.cash}"></label><label class="field">退休帳戶 USD<input required min="0" step="1000" name="retirement" type="number" value="${a.retirement}"></label><label class="field">教育基金 USD<input required min="0" step="1000" name="education" type="number" value="${a.education}"></label><label class="field">自住房 USD<input required min="0" step="1000" name="home" type="number" value="${a.home}"></label><label class="field">房屋貸款 USD<input required min="0" step="1000" name="debt" type="number" value="${a.debt}"></label><label class="field">股息投資年新增投入 USD<input required min="0" step="1000" name="annualDividend" type="number" value="${a.annualDividend}"></label><label class="field">教育基金年新增投入 USD<input required min="0" step="1000" name="annualEducation" type="number" value="${a.annualEducation}"></label><label class="field">退休帳戶年新增投入 USD<input required min="0" step="1000" name="annualRetirement" type="number" value="${a.annualRetireme
